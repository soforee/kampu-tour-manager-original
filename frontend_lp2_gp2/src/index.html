<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>KAMPU · Tour Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 176 124'><path d='M66 0L0 112h60z' fill='%231F3D2B'/><path d='M66 0l68 112H71z' fill='%231F3D2B'/><circle cx='125' cy='17' r='9' fill='%236B4A32'/><path d='M159 81l17 31h-34z' fill='%236B7A3A'/><rect y='117' width='176' height='7' fill='%236B4A32'/></svg>">

  <!-- Tailwind por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta tomada de la identidad visual KAMPU (Dirección B · Aventura y naturaleza)
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Archivo', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          // esquinas casi rectas, como los paneles de la marca
          borderRadius: { DEFAULT: '2px', sm: '2px', md: '2px', lg: '2px', xl: '3px', '2xl': '3px', '3xl': '4px' },
          colors: {
            white: '#F4F1E8', // crema KAMPU
            // neutros cálidos (arena -> verde bosque)
            zinc: {
              50: '#EFEADC', 100: '#E9E3D1', 200: '#DCD3BB', 300: '#C9BEA2', 400: '#9E9374', 500: '#76705A',
              600: '#585240', 700: '#3D3B2D', 800: '#1F3D2B', 900: '#16301F', 950: '#0F2216'
            },
            // verde oliva del isotipo (acento)
            brand: {
              50: '#F1F3E4', 100: '#E4E9CC', 200: '#CBD4A0', 300: '#AEBB76', 400: '#8A9A52',
              500: '#6B7A3A', 600: '#5B6930', 700: '#4A5527', 800: '#3A4320', 900: '#2B3218'
            },
            // verde de la carpa (estados "positivos")
            emerald: {
              50: '#E6EEE7', 100: '#CFDFD2', 200: '#A9C3B0', 300: '#7FA48B', 400: '#538265',
              500: '#34634A', 600: '#27503A', 700: '#1F3D2B', 800: '#183123', 900: '#16301F'
            },
            // marrón del sol y la base
            earth: { 50: '#F4EDE6', 100: '#E6D6C7', 300: '#B58E6D', 400: '#8C6A4C', 500: '#6B4A32', 600: '#5A3D28', 700: '#472F1F' },
            sand: { 100: '#F4F1E8', 200: '#E6DFCD', 300: '#D8CDB4' }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @layer components {
      .field { @apply w-full rounded-lg border border-zinc-200 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 disabled:bg-zinc-50 disabled:text-zinc-400; }
      .label { @apply block text-sm font-medium text-zinc-700 mb-1.5; }
      .btn-dark { @apply inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2.5 transition-colors bg-zinc-900 text-white hover:bg-zinc-800 disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-light { @apply inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2.5 transition-colors bg-white text-zinc-700 border border-zinc-200 hover:bg-zinc-50 disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-brand { @apply inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2.5 transition-colors bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-danger { @apply inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2.5 transition-colors bg-rose-50 text-rose-700 hover:bg-rose-100 disabled:opacity-50 disabled:cursor-not-allowed; }
      .card { @apply bg-white rounded-2xl border border-zinc-200; }
      .th { @apply px-5 py-3 text-left font-mono text-[11px] font-medium uppercase tracking-[0.12em] text-zinc-500 whitespace-nowrap; }
      .td { @apply px-5 py-3.5; }
      .icon-btn { @apply inline-flex p-2 rounded-lg text-zinc-400 hover:text-zinc-800 hover:bg-zinc-100 transition-colors; }
      .icon-btn-danger { @apply inline-flex p-2 rounded-lg text-zinc-400 hover:text-rose-600 hover:bg-rose-50 transition-colors; }
      .h1 { @apply text-2xl font-extrabold tracking-tight text-zinc-900; }
      .eyebrow { @apply font-mono text-[11px] uppercase tracking-[0.14em] text-zinc-500; }
    }
  </style>
</head>
<body class="bg-sand-200 text-zinc-800 antialiased font-sans">
  <app-root></app-root>
</body>
</html>
